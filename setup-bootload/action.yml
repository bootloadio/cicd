name: Set up bootload CLI
description: >-
  Install the bootload CLI on the runner and, optionally, authenticate it so
  later steps can deploy, push images or read logs.
author: faastic bv
branding:
  icon: anchor
  color: blue

inputs:
  expect-version:
    description: >-
      Fail the job if the installed CLI is not this version, e.g. v0.1.22.
      The platform serves one current release, so this is an assertion rather
      than a download pin: your pipeline breaks loudly when the CLI changes
      under it, instead of changing behaviour silently. Leave empty to accept
      whatever is current.
    required: false
    default: ""
  api:
    description: API base URL. Leave empty for production (https://my.bootload.io).
    required: false
    default: ""
  token:
    description: >-
      A bootload API key, from `bootload token create`. Store it as a repository
      secret and pass it here; it is exported as BOOTLOAD_TOKEN for later steps.
      Leave empty if the job only uses a deploy hook, which needs no API key.
    required: false
    default: ""
  project:
    description: >-
      Project name or id to select as the default for later steps, via
      `bootload project use`. Needs a token, and a CLI of v0.1.21 or newer.
    required: false
    default: ""
  org:
    description: >-
      Organization slug or id to select as the default for later steps, via
      `bootload org use`. Needs a token, and a CLI of v0.1.21 or newer.
    required: false
    default: ""

outputs:
  version:
    description: The CLI version that was installed.
    value: ${{ steps.install.outputs.version }}

runs:
  using: composite
  steps:
    - id: install
      shell: bash
      env:
        BOOTLOAD_API: ${{ inputs.api }}
        EXPECT_VERSION: ${{ inputs.expect-version }}
      run: |
        set -euo pipefail
        base="${BOOTLOAD_API:-https://my.bootload.io}"
        # The installer is served by the platform, so the runner gets exactly
        # the build that deployment publishes, checksum-verified.
        curl -fsSL "$base/v1/cli/install.sh" | sh
        # It installs to /usr/local/bin when writable, else ~/.local/bin.
        # Put both on PATH for every later step rather than guessing.
        echo "/usr/local/bin" >> "$GITHUB_PATH"
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"
        export PATH="/usr/local/bin:$HOME/.local/bin:$PATH"
        command -v bootload >/dev/null 2>&1 || { echo "::error::the CLI installed but is not on PATH"; exit 1; }
        got="$(bootload --version | tr -d '\r')"
        echo "version=$got" >> "$GITHUB_OUTPUT"
        echo "$got"
        if [ -n "${EXPECT_VERSION:-}" ] && [ "${got#*$EXPECT_VERSION}" = "$got" ]; then
          echo "::error::expected CLI $EXPECT_VERSION but the platform serves $got"
          exit 1
        fi

    - shell: bash
      env:
        BOOTLOAD_TOKEN: ${{ inputs.token }}
        BOOTLOAD_API: ${{ inputs.api }}
        IN_PROJECT: ${{ inputs.project }}
        IN_ORG: ${{ inputs.org }}
      run: |
        set -euo pipefail
        export PATH="/usr/local/bin:$HOME/.local/bin:$PATH"
        # Export for later steps. Masking is GitHub's job for a secret input,
        # but do it explicitly too: a token pasted as a plain input would
        # otherwise be readable in the log.
        if [ -n "${BOOTLOAD_TOKEN:-}" ]; then
          echo "::add-mask::$BOOTLOAD_TOKEN"
          echo "BOOTLOAD_TOKEN=$BOOTLOAD_TOKEN" >> "$GITHUB_ENV"
        fi
        if [ -n "${BOOTLOAD_API:-}" ]; then
          echo "BOOTLOAD_API=$BOOTLOAD_API" >> "$GITHUB_ENV"
        fi
        # Selecting a default org/project means writing the CLI's config,
        # which is what `org use` / `project use` do. There are no
        # BOOTLOAD_ORG / BOOTLOAD_PROJECT environment variables: exporting
        # those looked right and silently did nothing (caught by running this
        # action against a real fleet, 2026-09-19).
        if [ -n "${IN_ORG:-}${IN_PROJECT:-}" ]; then
          if [ -z "${BOOTLOAD_TOKEN:-}" ]; then
            echo "::error::org/project need a token to resolve; pass token, or drop them and use --project on each step"
            exit 1
          fi
          # No pre-flight check for the command's existence: `bootload org
          # use --help` exits 0 even on a CLI that has no `use` subcommand
          # (cobra prints the parent's help), so the guard passed and the
          # customer then got a confusing "could not select organization".
          # Run the real thing and name both causes when it fails.
          # Show what the CLI said rather than guessing at the cause. An
          # earlier version replaced its message with a list of maybes, and
          # when a real account turned out to belong to several organizations
          # the log blamed the project name and the CLI version, while the
          # CLI itself had printed "multiple organizations — pass --org".
          select_one() { # <org|project> <value>
            local out
            if out=$(bootload "$1" use "$2" 2>&1); then
              return 0
            fi
            echo "::error::could not select $1 '$2': $out"
            case "$out" in
              *"multiple organizations"*)
                echo "::error::this account is in more than one organization, so a project name is ambiguous — set the 'org' input as well" ;;
              *"unknown subcommand"*|*"unknown command"*)
                echo "::error::this deployment serves a CLI older than v0.1.21, which has no '$1 use' — drop the org/project inputs and pass --project on each step" ;;
            esac
            exit 1
          }
          # Org first: a project name is resolved inside the selected org.
          [ -n "${IN_ORG:-}" ] && select_one org "$IN_ORG"
          [ -n "${IN_PROJECT:-}" ] && select_one project "$IN_PROJECT"
          true
        fi
